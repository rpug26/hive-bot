name: Apply Request History Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          set -e
          patch -p1 --forward < patches/request_history_fix.patch || {
            echo "Trying with fuzz..."
            patch -p1 --forward --fuzz=3 < patches/request_history_fix.patch
          }
          echo "Patch applied"
          rg -n "History must never depend|Watchlist add:" bot.py | head

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes (already applied?)"
          else
            git commit -m "Apply Notion auto-sync: History first + watchlist logging"
            git push origin HEAD
          fi
